[package]
name = "oxider-query-codegen"
description = "Generate OxideR-Query entity structs from an existing database schema"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"

[dependencies]
sqlx = { workspace = true }

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]

[dev-dependencies]
tokio = { workspace = true }
sqlx = { workspace = true, features = ["sqlite"] }
# Used only to assert the generated source parses as Rust.
syn = { workspace = true }
