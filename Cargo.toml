[workspace]
resolver = "2"
members = [
    "crates/oxider-query-core",
    "crates/oxider-query-macros",
    "crates/oxider-query-exec",
    "crates/oxider-query-codegen",
    "crates/oxider-query",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/OxideR-System/OxideR-Query"
authors = ["OxideR System"]

[workspace.dependencies]
oxider-query-core = { path = "crates/oxider-query-core", version = "0.2.1" }
oxider-query-macros = { path = "crates/oxider-query-macros", version = "0.2.1" }
oxider-query-exec = { path = "crates/oxider-query-exec", version = "0.2.1" }
# The facade, for the exec crate's own tests. Every cross-crate version lives
# in this table so a release bumps one file.
oxider-query = { path = "crates/oxider-query", version = "0.2.1" }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["macros", "rt", "sync"] }
