name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # Every suite that needs a server skips itself when its URL is unset, which
    # keeps a local `cargo test` serverless but would also let the whole run
    # pass having tested nothing. CI is where they have to really run, so each
    # engine gets a service container here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: oxider
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: oxider
        ports:
          - 3306:3306
        # MySQL answers pings before it finishes its first-run setup, so this
        # gets more retries than Postgres rather than the same number.
        options: >-
          --health-cmd "mysqladmin ping -uroot -pci --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OXIDER_POSTGRES_URL: postgres://postgres:ci@localhost:5432/oxider
      OXIDER_MYSQL_URL: mysql://root:ci@localhost:3306/oxider
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # `--all-targets` silently skips doc tests, and every compile-time
      # guarantee this library advertises is pinned by a `compile_fail` doc
      # test, so the two runs together are what actually covers the suite.
      - name: Test
        run: cargo test --workspace --all-targets --all-features
      - name: Doc tests
        run: cargo test --workspace --all-features --doc
      # The suites above skip themselves without a server, and a skip looks
      # exactly like a pass. This asserts they actually connected, so a broken
      # service container fails the job instead of quietly halving the run.
      - name: Assert the end-to-end suites ran
        run: |
          set -euo pipefail
          for suite in postgres_end_to_end mysql_end_to_end postgres_introspection; do
            output=$(cargo test --workspace --all-features --test "$suite" -- --nocapture)
            if grep -q "is not set, skipping" <<<"$output"; then
              echo "::error::$suite skipped itself; its server was not reachable"
              exit 1
            fi
          done

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Vulnerabilities fail the job; unmaintained-crate warnings do not, so a
      # transitive dependency going quiet does not block unrelated work.
      - name: Audit dependencies
        run: |
          set -euo pipefail
          cargo audit
          # cargo-audit passes over an ignored advisory in silence, so the log
          # would read the same whether an exception exists or not. Print them:
          # an exception nobody sees is an exception nobody revisits.
          echo "Advisories ignored, with the reasoning in .cargo/audit.toml:"
          grep -o 'RUSTSEC-[0-9-]*' .cargo/audit.toml | sort -u
