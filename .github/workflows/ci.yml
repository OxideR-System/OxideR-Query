name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # The Postgres end-to-end suite skips itself when OXIDER_POSTGRES_URL is
    # unset, which keeps a local `cargo test` serverless but would also let the
    # whole suite pass having run nothing. CI is where it has to really run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: oxider
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OXIDER_POSTGRES_URL: postgres://postgres:ci@localhost:5432/oxider
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # `--all-targets` silently skips doc tests, and every compile-time
      # guarantee this library advertises is pinned by a `compile_fail` doc
      # test, so the two runs together are what actually covers the suite.
      - name: Test
        run: cargo test --workspace --all-targets --all-features
      - name: Doc tests
        run: cargo test --workspace --all-features --doc

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Vulnerabilities fail the job; unmaintained-crate warnings do not, so a
      # transitive dependency going quiet does not block unrelated work.
      - name: Audit dependencies
        run: cargo audit
